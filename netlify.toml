# Netlify configuration for Horus Heresy Dataslate

[build]
  publish = "."

# No SPA catch-all. This is a multi-asset static site with no client-side
# router, so a `from = "/*" to = "/index.html" status = 200` rule bought nothing
# and cost correctness: every 404, including a mistyped cover path, returned the
# full page with HTTP 200. Soft 404s get indexed and real ones become invisible.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# Cover art and portraits are content-addressed by filename in practice, so they
# can be cached hard. This is the bulk of the payload.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000"

[[headers]]
  for = "/favicon.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Code and data change together and are not fingerprinted, so revalidate.
[[headers]]
  for = "/script.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/styles.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Fetched at runtime by the ordering guide modal.
[[headers]]
  for = "/ORDERING_DECISIONS.md"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "text/markdown; charset=utf-8"
